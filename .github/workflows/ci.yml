name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: 0.12.1

      - name: Install dependencies
        run: uv sync --all-extras --locked

      - name: Lint with ruff
        run: uv run ruff check src tests

      - name: Check formatting with ruff
        run: uv run ruff format --check .

      - name: Lint markdown docs
        run: make lint-docs

      # Build the docs on every PR, not just on push-to-main. deploy-docs only
      # runs post-merge, so a change that breaks the docs build (a dependency
      # bump, a bad snippet) would merge green and fail after the fact, leaving
      # Pages stale until someone fixed it forward. Lint is a required check,
      # so this makes a broken docs build block the PR instead.
      - name: Build docs (strict)
        run: uv run mkdocs build --strict

  tests:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: 0.12.1

      - name: Install dependencies
        run: uv sync --all-extras --locked

      - name: Type check with pyrefly
        run: uv run pyrefly check

      - name: Security check with bandit
        run: uv run bandit -r src -c pyproject.toml

      - name: Run unit tests with coverage
        run: uv run pytest -m "not integration"

      - name: Run integration tests
        # GH_TOKEN is required: test_dev_stack_hygiene's upstream-tag guard
        # shells out to `gh api`. Without it `gh` is unauthenticated on a clean
        # runner, every call fails, and the test SKIPS — leaving every required
        # check green while the only guard that verifies Renovate managers
        # against upstream reality never runs.
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run pytest -m integration --cov-append

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
