name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      # Build the docs from the locked dependency set rather than a bare
      # `pip install mkdocs-material mkdocs-redirects`. That form pulled
      # whatever was newest at build time, bypassing uv.lock entirely and
      # leaving the docs toolchain as the one thing in CI Renovate could not
      # see. The `docs` extra is already declared in pyproject.toml and pinned
      # in uv.lock, so --locked keeps this reproducible.
      - name: Install dependencies
        run: uv sync --extra docs --locked

      - name: Build docs
        run: uv run mkdocs build --strict

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
