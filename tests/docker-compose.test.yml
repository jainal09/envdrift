# Integration test infrastructure for envdrift
# Usage: docker-compose -f tests/docker-compose.test.yml up -d
#
# Services:
#   - LocalStack: AWS Secrets Manager emulator (port 4566)
#   - Vault: HashiCorp Vault dev server (port 8200)
#   - Lowkey Vault: Azure Key Vault emulator (port 8443)

services:
  localstack:
    # LocalStack consolidated to a single CalVer image in 2026.03.0 and made it
    # account-gated: without LOCALSTACK_AUTH_TOKEN it exits(55) with "License
    # activation failed". The old tokenless community image is gone (the
    # ACKNOWLEDGE_ACCOUNT_REQUIREMENT bypass expired 2026-04-06), and the last
    # tokenless release was 4.14.0.
    #
    # A free Hobby token covers everything this suite needs. Verified 2026-08-02
    # against 2026.07.1 with a Hobby token: the container boots healthy and
    # secretsmanager is "available" — create-secret/get-secret-value both work.
    # Hobby exposes kms, lambda, s3, secretsmanager and sts, so keep SERVICES
    # within that set (tests/unit/test_dev_stack_hygiene.py enforces it) or the
    # stack would need a paid plan.
    image: localstack/localstack:2026.07.5  # Keep in sync with .github/workflows/integration-tests.yml
    ports:
      - "4566:4566"
    environment:
      # Required since 2026.03.0. Get a free Hobby token at
      # https://app.localstack.cloud and export it, or put it in tests/.env
      # (gitignored). Never commit the token.
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN:?LOCALSTACK_AUTH_TOKEN is required - get a free Hobby token at https://app.localstack.cloud}
      - SERVICES=secretsmanager
      - DEBUG=0
      - EAGER_SERVICE_LOADING=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      # Matches the CI service-container window (integration-tests.yml). The
      # CalVer images are larger and boot more services than the old 4.x line,
      # and `make test-integration-up` uses `--wait`, so too tight a window
      # fails the local stack outright.
      retries: 20
      start_period: 30s

  vault:
    image: hashicorp/vault:2.0.4  # Keep in sync with .github/workflows/integration-tests.yml
    # Match integration-tests.yml (`--user root`) so the setcap/IPC_LOCK
    # behavior is identical between the local compose stack and CI.
    user: root
    ports:
      - "8200:8200"
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=test-root-token
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
      - VAULT_ADDR=http://0.0.0.0:8200
      # Newer hashicorp/vault image builds ship without `setcap`; skip it and
      # disable mlock so the dev container starts (matches integration-tests.yml).
      - SKIP_SETCAP=true
      - VAULT_DISABLE_MLOCK=true
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  lowkey-vault:
    # 7.3.0+ is required: older images reject the api-version (2025-07-01)
    # sent by the azure-keyvault-secrets SDK with HTTP 400.
    image: nagyesta/lowkey-vault:7.3.74  # Keep in sync with .github/workflows/integration-tests.yml
    ports:
      - "8443:8443"
      # HTTP port serving the built-in managed-identity token stub
      # (GET /metadata/identity/oauth2/token). DefaultAzureCredential in the
      # envdrift CLI gets its dummy token here via
      # AZURE_POD_IDENTITY_AUTHORITY_HOST (see tests/integration/conftest.py).
      - "8080:8080"
    environment:
      - LOWKEY_VAULT_NAMES=envdrift-test-vault
    healthcheck:
      # The 7.3.x image is BusyBox-based and ships wget but NOT curl; a curl
      # healthcheck can never pass, so `docker compose up --wait`
      # (make test-integration-up) would fail with the container "unhealthy".
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "--no-check-certificate",
          "https://localhost:8443/ping",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
